apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-service
  namespace: crm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: crm
  labels:
    app: admin-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      serviceAccountName: admin-service
      containers:
        - name: admin-service
          image: admin-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: crm
spec:
  type: ClusterIP
  selector:
    app: admin-service
  ports:
    - name: http
      port: 80
      targetPort: 3000
