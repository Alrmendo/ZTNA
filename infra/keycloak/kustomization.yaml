apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iam

resources:
  - namespace.yaml
  - deployment.yaml

# Generates the Keycloak realm ConfigMap directly from realm-export.json,
# so that file stays the single source of truth for realm/role/user config
# (infrastructure-as-code, no manual UI configuration).
configMapGenerator:
  - name: keycloak-realm-config
    files:
      - realm-export.json
