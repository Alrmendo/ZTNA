# GĐ6 — công cụ đo latency tạm thời, KHÔNG phải một phần kiến trúc lab.
# Namespace này CHỦ Ý không bật istio-injection và không có Pomerium đứng
# trước — đây là điểm tham chiếu "raw latency" (tương đương trạng thái
# GĐ3, chưa qua bất kỳ lớp security nào), dùng để tính overhead so với
# đường đi thật (crm + Istio + Pomerium) đang chạy. Xoá sạch ở bước cuối
# GĐ6 (docs/MEASUREMENT.md), không giữ lại lâu dài.
apiVersion: v1
kind: Namespace
metadata:
  name: perf-baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: perf-baseline
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: perf-baseline
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: perf-baseline
  labels:
    app: admin-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      containers:
        - name: admin-service
          image: admin-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: perf-baseline
spec:
  type: ClusterIP
  selector:
    app: admin-service
  ports:
    - name: http
      port: 80
      targetPort: 3000
