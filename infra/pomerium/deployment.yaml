apiVersion: v1
kind: ServiceAccount
metadata:
  name: pomerium
---
# GĐ5: Pomerium tham gia Istio mesh (sidecar injection bật qua label
# istio-injection=enabled trên namespace "gateway") để có identity mTLS
# (cluster.local/ns/gateway/sa/pomerium) khi gọi admin-service — bắt buộc
# vì admin-service giờ áp PeerAuthentication STRICT. Xem docs/NOTES.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pomerium
  labels:
    app: pomerium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pomerium
  template:
    metadata:
      labels:
        app: pomerium
      annotations:
        # Pomerium tự terminate TLS trên port 8080 bằng cert riêng
        # (tls-lab-only/) — đây là biên North-South (ZTNA gateway ingress),
        # không phải mTLS East-West nội bộ mesh. Loại port này khỏi
        # interception INBOUND của sidecar để tránh Envoy cố xử lý byte
        # TLS của Pomerium như traffic mesh (gây "filter_chain_not_found"/
        # reset kết nối — phát hiện khi regression-test GD5 bước 5).
        # OUTBOUND (Pomerium -> admin-service) vẫn bị sidecar bắt bình
        # thường để tự động mTLS, đúng mục đích đưa Pomerium vào mesh.
        traffic.sidecar.istio.io/excludeInboundPorts: "8080"
    spec:
      serviceAccountName: pomerium
      containers:
        - name: pomerium
          image: pomerium/pomerium:latest
          args: ["-config", "/etc/pomerium/config.yaml"]
          envFrom:
            - secretRef:
                name: pomerium-secrets
          ports:
            - name: https
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/pomerium
              readOnly: true
            - name: tls
              mountPath: /etc/pomerium/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: pomerium-config
        - name: tls
          secret:
            secretName: pomerium-tls
---
# Service dùng làm authenticate_service_url (domain riêng cho OIDC
# redirect/callback, tách khỏi domain của route /admin bên dưới).
apiVersion: v1
kind: Service
metadata:
  name: pomerium
spec:
  type: ClusterIP
  selector:
    app: pomerium
  ports:
    - name: https
      port: 8080
      targetPort: 8080
---
# Service dùng làm "from" domain của route /admin. Cùng trỏ tới pod
# Pomerium (Pomerium tự định tuyến theo Host header của request, không
# theo Service nào nhận traffic) — DNS riêng để tách domain khỏi
# authenticate_service_url như Pomerium yêu cầu.
apiVersion: v1
kind: Service
metadata:
  name: admin
spec:
  type: ClusterIP
  selector:
    app: pomerium
  ports:
    - name: https
      port: 8080
      targetPort: 8080
